<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Crear ficha · Menudos Artistas</title>
<link rel="stylesheet" href="css/estilos.css">
<script src="js/auth.js"></script>
<style>
  body.menudos{--acento:#d6336c;--acento2:#f5991e}
  body.menudos .btn-secundario:hover{background:#fdeef2}
  body.menudos .cat-tag{background:#fbe4ec;color:#9d174d}
  body.menudos .cat-tag.origen-impro{background:#dbeafe;color:#1e3a8a}
</style>
</head>
<body class="menudos">

<header class="top">
  <a class="brand" href="menudos.html">
    <img src="img/logo-menudos.png" onerror="this.style.display='none'" alt="Menudos Artistas">
    <span class="brand-txt" style="font-family:'Segoe UI',sans-serif;font-size:1.5rem;letter-spacing:0"><span style="color:#d6336c">MENUDOS</span> <span style="color:#f5991e">ARTISTAS</span></span>
  </a>
  <span class="brand-sub">📋 Crear ficha</span>
  <nav>
    <a class="btn btn-secundario" href="index.html" title="Ir al buscador de ImproXpresión">🎭 ImproXpresión</a>
    <a class="btn btn-secundario" href="menudos.html">🧒 Volver al buscador <span class="badge-carrito" id="badgeCarrito">0</span></a>
  </nav>
</header>

<div class="contenedor">

  <section class="meta-ficha">
    <div>
      <label>Título de la ficha</label>
      <input type="text" id="fTitulo" placeholder="Clase niños martes / Clase especial...">
    </div>
    <div>
      <label>Fecha</label>
      <input type="date" id="fFecha">
    </div>
    <div>
      <label>Grupo</label>
      <input type="text" id="fGrupo" placeholder="Grupo Ugena, Cubas, Serranillos...">
    </div>
  </section>

  <div id="listaFicha" class="lista-ficha"></div>

  <div class="vacio-ficha" id="vacio" style="display:none">
    <h3>La ficha está vacía</h3>
    <p>Ve al <a href="menudos.html">buscador</a> y añade juegos con el botón <strong>+ Ficha</strong>.</p>
  </div>

  <div class="resumen-tiempo">
    <span class="total" id="totalMin">0 min</span>
    <span class="aviso" id="avisoMin"></span>
    <div class="acciones">
      <button class="btn btn-secundario" id="btnGuardarFicha">💾 Guardar</button>
      <button class="btn btn-secundario" id="btnExportarMd">⬇ Descargar .md</button>
      <button class="btn btn-primario" id="btnImprimir">🖨 Imprimir / PDF</button>
      <button class="btn btn-rojo" id="btnVaciar">🗑 Vaciar</button>
    </div>
  </div>

  <section class="fichas-guardadas no-print">
    <h2>🎭 Fichas de clase</h2>
    <div id="listaBase"></div>
  </section>

  <section class="fichas-guardadas no-print">
    <h2>📚 Fichas guardadas</h2>
    <div id="listaGuardadas"></div>
  </section>

</div>

<script src="data/juegos.js"></script>
<script src="data/juegos_menudos.js"></script>
<script src="data/fichas.js"></script>
<script src="js/comun-menudos.js"></script>
<script src="js/ficha-menudos.js"></script>
</body>
</html>
