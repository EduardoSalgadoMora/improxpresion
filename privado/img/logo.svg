<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <!-- Logo ImproXpresión (recreación): círculo azul con X naranja de brochazo -->
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="6"/></filter>
  </defs>
  <!-- aro exterior naranja tipo boceto -->
  <circle cx="110" cy="110" r="97" fill="none" stroke="#f5991e" stroke-width="7" stroke-dasharray="150 12 90 8 200 10" filter="url(#rough)"/>
  <!-- círculo azul con borde blanco -->
  <circle cx="110" cy="110" r="86" fill="#ffffff"/>
  <circle cx="110" cy="110" r="78" fill="#3b7dbf"/>
  <!-- X de brochazo naranja -->
  <g stroke="#f5991e" stroke-width="38" stroke-linecap="butt" filter="url(#rough)">
    <line x1="32" y1="32" x2="188" y2="188"/>
    <line x1="188" y1="32" x2="32" y2="188"/>
  </g>
  <!-- salpicaduras -->
  <g fill="#f5991e" filter="url(#rough)">
    <circle cx="196" cy="176" r="5"/>
    <circle cx="30" cy="182" r="4"/>
    <circle cx="186" cy="42" r="4"/>
    <circle cx="36" cy="40" r="5"/>
  </g>
</svg>
