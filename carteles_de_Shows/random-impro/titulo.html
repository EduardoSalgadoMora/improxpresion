<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
body{width:860px;height:380px;position:relative;overflow:hidden}
.title{position:absolute;left:0;right:0;top:22px;text-align:center;font-family:"Inter Display";font-weight:900;line-height:.86;letter-spacing:-.045em;color:#12569f}
.title span{display:block;font-size:178px}
.title .b{color:#fff;-webkit-text-stroke:5px #12569f}
.ball{position:absolute;border-radius:50%;box-shadow:0 12px 24px rgba(0,0,0,.3), inset -10px -14px 22px rgba(0,0,0,.28), inset 8px 10px 18px rgba(255,255,255,.3)}
.ball span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:50%;height:50%;border-radius:50%;background:#fff;color:#141414;font-family:"Inter Display";font-weight:900;display:flex;align-items:center;justify-content:center;letter-spacing:-.04em}
.g{background:#2FB462;width:86px;height:86px;top:196px;left:22px;transform:rotate(-14deg)}.g span{font-size:21px}
.o{background:#F5821F;width:110px;height:110px;top:178px;right:14px;transform:rotate(12deg)}.o span{font-size:27px}
.r{background:#E23A3A;width:70px;height:70px;top:268px;right:118px;transform:rotate(20deg)}.r span{font-size:17px}
</style></head><body>
<div class="title"><span>RANDOM</span><span class="b">IMPRO</span></div>
</body></html>
