<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#141414;color:#fff;font-family:"Inter",sans-serif;position:relative;overflow:hidden}
.top{position:absolute;top:80px;left:90px;right:90px;display:flex;justify-content:space-between;font-weight:600;font-size:24px;letter-spacing:.32em;color:#F5821F}
.top span:last-child{color:#777}
.ball{position:absolute;border-radius:50%;box-shadow:0 30px 60px rgba(0,0,0,.5), inset -18px -24px 40px rgba(0,0,0,.28), inset 14px 16px 30px rgba(255,255,255,.25)}
.ball span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:50%;height:50%;border-radius:50%;background:#fff;color:#141414;font-family:"Inter Display";font-weight:900;display:flex;align-items:center;justify-content:center;letter-spacing:-.04em}
.g{background:#2FB462;width:150px;height:150px;top:205px;left:560px;transform:rotate(-14deg)}
.g span{font-size:36px}
.o{background:#F5821F;width:230px;height:230px;top:170px;right:95px;transform:rotate(12deg)}
.o span{font-size:56px}
.r{background:#E23A3A;width:120px;height:120px;top:360px;left:700px;transform:rotate(20deg)}
.r span{font-size:28px}
.title{position:absolute;left:78px;top:450px;font-family:"Inter Display";font-weight:900;line-height:.86;letter-spacing:-.045em}
.title span{font-size:218px;display:block}
.title .b{color:transparent;-webkit-text-stroke:5px #fff}
.tag{position:absolute;left:90px;top:920px;font-size:36px;font-weight:300;color:#bbb}
.tag b{color:#fff;font-weight:600}
.names{position:absolute;left:90px;right:90px;top:1010px;border-top:2px solid #333;padding-top:34px;font-size:30px;font-weight:700;letter-spacing:.14em;display:flex;justify-content:space-between}
.foot{position:absolute;left:90px;right:90px;bottom:85px;display:flex;justify-content:space-between;align-items:flex-end}
.when{font-family:"Inter Display";font-weight:900;font-size:64px;line-height:1;letter-spacing:-.02em}
.when small{display:block;font-family:"Inter";font-weight:500;font-size:24px;letter-spacing:.2em;color:#F5821F;margin-top:16px}
.foot img{height:92px}
</style></head><body>
<div class="top"><span>IMPROXPRESIÓN</span><span>EVENTO PRIVADO</span></div>
<div class="ball g"><span>10</span></div>
<div class="ball o"><span>24</span></div>
<div class="ball r"><span>36</span></div>
<div class="title"><span>RANDOM</span><span class="b">IMPRO</span></div>
<div class="tag">Saca una bola. <b>Improvisamos lo que salga.</b></div>
<div class="names"><span>EDU SALGADO</span><span>SILVIA MIELGO</span><span>ABRAHAM EFEGÉ</span></div>
<div class="foot"><div class="when">22 NOV · 16.30H<small>ESCUELA DE MÚSICA MANUEL DE FALLA</small></div><img src="logo-blanco.png"></div>
</body></html>
